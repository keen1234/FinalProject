<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Signup</title>
    <link rel="stylesheet" href="/css/logs.css">
</head>
<body>
<div class="container">
    <h2>Sign Up</h2>
    <div>
        <th:block th:if="${param.error != null and param.error[0] == 'email'}">
            <span style="color:red;">Email already exists. Please use a different email.</span>
        </th:block>
        <th:block th:if="${param.error != null and param.error[0] == 'course'}">
            <span style="color:red;">Invalid course selected.</span>
        </th:block>
    </div>
    <form method="POST" action="/user-signup">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address">

        <label for="number">Contact Number:</label>
        <input type="text" id="number" name="number">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <!-- IT Courses -->
            <optgroup label="Information Technology">
                <option value="BSIT">BSIT</option>
                <option value="BSCS">BSCS</option>
                <option value="BSIS">BSIS</option>
                <option value="IT-2YR">IT-2YR</option>
                <option value="ACT-2YR">ACT-2YR</option>
            </optgroup>

            <!-- Business & Management -->
            <optgroup label="Business & Management">
                <option value="BSBA">BSBA</option>
                <option value="BSA">BSA</option>
                <option value="BSAIS">BSAIS</option>
                <option value="BSMA">BSMA</option>
                <option value="BSRTCS">BSRTCS</option>
                <option value="ART-2YR">ART-2YR</option>
            </optgroup>

            <!-- Hospitality Management -->
            <optgroup label="Hospitality Management">
                <option value="BSHM">BSHM</option>
                <option value="BSCM">BSCM</option>
                <option value="HRA-3YR">HRA-3YR</option>
                <option value="HRS-2YR">HRS-2YR</option>
            </optgroup>

            <!-- Tourism Management -->
            <optgroup label="Tourism Management">
                <option value="BSTM">BSTM</option>
            </optgroup>

            <!-- Engineering -->
            <optgroup label="Engineering">
                <option value="BSCpE">BSCpE</option>
            </optgroup>

            <!-- Arts & Sciences -->
            <optgroup label="Arts & Sciences">
                <option value="BAPSY">BAPSY</option>
                <option value="BMMA">BMMA</option>
                <option value="BACOMM">BACOMM</option>
            </optgroup>

            <!-- Maritime -->
            <optgroup label="Maritime">
                <option value="BSMT">BSMT</option>
                <option value="BSMarE">BSMarE</option>
                <option value="BSNAME">BSNAME</option>
            </optgroup>

            <!-- Criminal Justice -->
            <optgroup label="Criminal Justice Education">
                <option value="BSCrim">BSCrim</option>
            </optgroup>
        </select>

        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login">Login here</a></p>
</div>
</body>
</html>
