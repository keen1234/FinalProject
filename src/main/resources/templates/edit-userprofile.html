<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/userprofile.css">
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <!-- ... reuse same nav as other templates if needed ... -->
    <div class="navbar-content">
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/book" class="nav-link">Book</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
        <div class="nav-auth">
            <a href="/login" class="nav-link" sec:authorize="isAnonymous()">Login</a>
        </div>
    </div>
</nav>
<main class="profile-main">
    <section class="profile-section">
        <h2>Edit Profile</h2>

        <form th:action="@{/userprofile/edit}" th:object="${profileDto}" method="post" class="edit-form">
            <input type="hidden" th:field="*{id}" />

            <div th:if="${#fields.hasGlobalErrors()}">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div th:if="${successMessage}" class="success-message">
                <p th:text="${successMessage}"></p>
            </div>

            <div>
                <label for="firstName">First name</label>
                <input type="text" id="firstName" th:field="*{firstName}" />
                <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>

            <div>
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" th:field="*{lastName}" />
                <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" />
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div>
                <label for="address">Address</label>
                <input type="text" id="address" th:field="*{address}" />
            </div>

            <div>
                <label for="number">Phone</label>
                <input type="text" id="number" th:field="*{number}" />
            </div>

            <div>
                <label for="course">Course</label>
                <select id="course" th:field="*{courseCode}">
                    <option th:each="c : ${courses}" th:value="${c.courseCode}" th:text="${c.courseCode + ' - ' + c.category}"></option>
                </select>
            </div>

            <div>
                <p>Leave password fields blank to keep your current password.</p>
                <label for="password">New password</label>
                <input type="password" id="password" th:field="*{password}" />
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <div>
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" />
            </div>

            <div>
                <button type="submit">Save changes</button>
                <a href="/userprofile">Cancel</a>
            </div>
        </form>

    </section>
</main>
</body>
</html>
