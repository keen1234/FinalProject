<!-- src/main/resources/templates/edit-book.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link rel="stylesheet" href="/css/book.css">
</head>
<body>
<h1 style="text-align: center;">Edit Book</h1>
<!-- Bind to the 'book' model attribute provided by the controller -->
<form th:action="@{/admin/book/edit/{id}(id=${book.id})}" method="post" th:object="${book}">
    <!-- Only render CSRF hidden input when a CSRF token is available to avoid parse-time errors -->
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <label>Title
        <input type="text" th:field="*{title}" required />
    </label>

    <label>Author
        <input type="text" th:field="*{author}" />
    </label>

    <label>Published Date
        <input type="date" th:field="*{datePublish}" th:value="${book.datePublish != null ? #temporals.format(book.datePublish,'yyyy-MM-dd') : ''}" />
    </label>

    <label>Genre
        <input type="text" th:field="*{genre}" />
    </label>

    <label>Language
        <input type="text" th:field="*{language}" />
    </label>

    <label>Description
        <textarea th:field="*{description}" rows="6"></textarea>
    </label>

    <div style="margin-top:1rem;">
        <button type="submit">Save</button>
        <button type="button" onclick="window.location.href='/admin/book'">Cancel</button>
    </div>
</form>
</body>
</html>
