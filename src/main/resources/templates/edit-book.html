<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit-book</title>
    <link rel="stylesheet" href="/css/book.css">
</head>
<body>
<h1 style="text-align: center;">Edit Book</h1>
<form th:action="@{/admin/book/edit/{id}(id=${book.id})}" method="post">
    <input type="text" name="title" th:value="${book.title}" required />
    <input type="text" name="author" th:value="${book.author}" required />
    <input type="text" name="genre" th:value="${book.genre}" />
    <input type="date" name="datePublish" th:value="${book.datePublish}" />
    <input type="text" name="language" th:value="${book.language}" placeholder="Language" required />
    <button type="submit">Save</button>
    <button type="button" onclick="window.location.href='/admin/book'">Cancel</button>
</form>
</body>
</html>
