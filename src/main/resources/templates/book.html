<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script th:inline="javascript">
        var isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
    </script>
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-content">
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/book" class="nav-link active">Book</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
        <div class="nav-auth">
            <button id="notificationBell" class="notification-bell" title="Notifications" aria-label="Notifications">
                <i class="fa fa-bell"></i>
                <span id="notificationCount" class="notification-count">0</span>
            </button>
            <a href="/login" class="nav-link" sec:authorize="isAnonymous()">Login</a>
            <div class="profile-menu" sec:authorize="isAuthenticated()">
                <button class="profile-btn">
                    <span class="profile-logo" th:text="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails) ? #authentication.principal.student.firstName.substring(0,1) : 'U'}">U</span>
                </button>
                <div id="profileDropdown" class="profile-dropdown">
                    <div class="profile-info">
                        <div class="profile-logo-large" th:text="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails) ? #authentication.principal.student.firstName.substring(0,1) : 'U'}">U</div>
                        <strong th:if="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails)}" th:text="${#authentication.principal.student.firstName + ' ' + #authentication.principal.student.lastName}">User Name</strong>
                        <span th:if="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails)}" th:text="${#authentication.principal.student.email}">user@email.com</span>
                    </div>
                    <hr>
                    <a href="/userprofile" class="profile-link">Profile</a>
                    <div style="height: 30px;"></div>
                    <a href="/logout" class="profile-link logout" style="position: absolute; bottom: 1rem; left: 1rem; right: 1rem;">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<div id="notificationBar" class="notification-bar"></div>
<!-- Separation between navbar and search bar -->
<div style="height: 1.5rem;"></div>
<div class="search-bar-wrapper">
    <div class="search-container" id="search-container">
        <label for="searchInput" class="visually-hidden">Search Books</label>
        <input type="text" id="searchInput" placeholder="Search books">
        <button class="search-btn" id="searchBtn" type="button">
            <i class="fas fa-search"></i>
        </button>
        <span class="search-label">Search</span>
        <button class="clear-btn" id="clearBtn" type="button">
            <i class="fas fa-times"></i> Clear
        </button>
        <div class="search-loading" id="searchLoading"></div>
        <div class="search-suggestions" id="searchSuggestions">
            <!-- Suggestions will be added dynamically -->
        </div>
    </div>
</div>

<!-- Main Content -->
<main class="main-content">
    <div class="container">
        <!-- Sorting Controls -->
        <form method="get" action="/book" class="sorting-controls">
            <h2>Sort Books By:</h2>
            <div class="sort-buttons">
                <button class="sort-btn" type="submit" name="sort" value="title">
                    <i class="fas fa-font"></i> Title
                </button>
                <button class="sort-btn" type="submit" name="sort" value="author">
                    <i class="fas fa-user"></i> Author
                </button>
                <button class="sort-btn" type="submit" name="sort" value="date">
                    <i class="fas fa-calendar"></i> Date
                </button>
                <label for="genreSort" class="visually-hidden">Sort by Genre</label>
                <select id="genreSort" name="genre" onchange="this.form.submit()">
                    <option value="">All Genres</option>
                    <option th:each="genre : ${genres}" th:value="${genre}" th:text="${genre}"></option>
                </select>
            </div>
        </form>
        <!-- Book List -->
        <div class="books-grid">
            <div th:each="book : ${books}" class="book-card" onclick="showBookModal(this)"
                th:data-title="${book.title}"
                th:data-author="${book.author}"
                th:data-datepublish="${book.datePublish}"
                th:data-genre="${book.genre}"
                th:data-language="${book.language}"
                th:data-description="${book.description}"
                th:data-status="${book.status}">
                <div class="book-card-content">
                    <h3 th:text="${book.title}">Book Title</h3>
                    <p><strong>Author:</strong> <span th:text="${book.author}">Author</span></p>
                    <p><strong>Published Date:</strong> <span th:text="${book.datePublish}">Date</span></p>
                    <p><strong>Genre:</strong> <span th:text="${book.genre}">Genre</span></p>
                    <p><strong>Language:</strong> <span th:text="${book.language}">Language</span></p>
                    <p><strong>Description:</strong> <span th:text="${book.description}">Description</span></p>
                    <p><strong>Status:</strong> <span th:text="${book.status}">Status</span></p>
                </div>
            </div>
        </div>
        <!-- Book Modal -->
        <div id="bookModal" class="book-detail-modal">
            <div class="modal-content" style="max-width: 520px; min-width: 320px; padding: 2.5rem 2rem;">
                <button class="close-btn" onclick="closeBookModal()">&times;</button>
                <div class="book-detail-content" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <h2 id="modalTitle" style="font-size: 2.2rem; font-weight: bold; margin-bottom: 0.5rem; color: #222;"></h2>
                    <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 0.5rem;">
                        <div style="flex: 1 1 180px;">
                            <p style="margin: 0 0 0.3rem 0;"><strong>Author:</strong> <span id="modalAuthor"></span></p>
                            <p style="margin: 0 0 0.3rem 0;"><strong>Genre:</strong> <span id="modalGenre"></span></p>
                            <p style="margin: 0 0 0.3rem 0;"><strong>Language:</strong> <span id="modalLanguage"></span></p>
                        </div>
                        <div style="flex: 1 1 120px;">
                            <p style="margin: 0 0 0.3rem 0;"><strong>Published Date:</strong> <span id="modalDatePublish"></span></p>
                            <p style="margin: 0 0 0.3rem 0;"><strong>Status:</strong> <span id="modalStatus"></span></p>
                        </div>
                    </div>
                    <div style="margin: 1rem 0 1.5rem 0;">
                        <h3 style="font-size: 1.1rem; margin-bottom: 0.3rem; color: #374151;">Description</h3>
                        <p id="modalDescription" style="color: #444; font-size: 1rem; line-height: 1.7; margin: 0;"></p>
                    </div>
                    <button id="reserveBtn" class="read-btn" style="align-self: flex-end; font-size: 1.1rem; padding: 0.7rem 2.2rem;">Reserve</button>
                </div>
            </div>
        </div>
    </div>
</main>
<script>
const profileBtn = document.querySelector('.profile-btn');
const profileDropdown = document.getElementById('profileDropdown');

let dropdownOpen = false;

if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
            profileDropdown.classList.add('show');
        } else {
            profileDropdown.classList.remove('show');
        }
    });
    document.addEventListener('click', function(e) {
        if (dropdownOpen && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.remove('show');
            dropdownOpen = false;
        }
    });
}

function showBookModal(card) {
    document.getElementById('modalTitle').textContent = card.getAttribute('data-title');
    document.getElementById('modalAuthor').textContent = card.getAttribute('data-author');
    document.getElementById('modalDatePublish').textContent = card.getAttribute('data-datepublish');
    document.getElementById('modalGenre').textContent = card.getAttribute('data-genre');
    document.getElementById('modalLanguage').textContent = card.getAttribute('data-language');
    document.getElementById('modalDescription').textContent = card.getAttribute('data-description');
    document.getElementById('modalStatus').textContent = card.getAttribute('data-status');
    document.getElementById('bookModal').classList.add('show');
}
function closeBookModal() {
    document.getElementById('bookModal').classList.remove('show');
}
document.getElementById('reserveBtn').onclick = function() {
    if (!isAuthenticated) {
        if (confirm('You must be logged in to reserve a book. Login now?')) {
            window.location.href = '/login';
        }
        return;
    }
    const title = document.getElementById('modalTitle').textContent;
    fetch('/api/reserve', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ title })
    })
    .then(response => response.json().then(data => ({ status: response.status, body: data })))
    .then(result => {
        if (result.status === 200) {
            showNotification('Reservation request sent to admin!', 'success');
        } else {
            let errorMsg = result.body.message;
            if (typeof errorMsg !== 'string') {
                errorMsg = JSON.stringify(errorMsg);
            }
            showNotification(errorMsg || 'Error sending reservation.', 'error');
        }
    })
    .catch(() => showNotification('Error sending reservation.', 'error'));
};

// Notification bell logic
const notificationBell = document.getElementById('notificationBell');
const notificationCount = document.getElementById('notificationCount');
let notifications = [];
notificationBell.addEventListener('click', function() {
    if (notifications.length > 0) {
        alert(notifications.join('\n'));
        notifications = [];
        notificationCount.style.display = 'none';
        notificationCount.textContent = '0';
    } else {
        alert('No new notifications');
    }
});
function addNotification(message) {
    notifications.push(message);
    notificationCount.textContent = notifications.length;
    notificationCount.style.display = 'inline-block';
}
// Example usage: addNotification('Your reservation was accepted!');
function showNotification(message, type = 'success') {
    const bar = document.getElementById('notificationBar');
    bar.textContent = message;
    bar.className = 'notification-bar ' + type;
    bar.style.display = 'block';
    setTimeout(() => { bar.style.display = 'none'; }, 3500);
}
</script>
</body>
</html>
