<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>books</title>
    <link rel="stylesheet" href="/css/book.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-content">
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/book" class="nav-link active">Book</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
        <div class="nav-auth">
            <a href="/login" class="nav-link" sec:authorize="isAnonymous()">Login</a>
            <div class="profile-menu" sec:authorize="isAuthenticated()">
                <button class="profile-btn" onclick="document.getElementById('profileDropdown').classList.toggle('show')">
                    <span class="profile-logo" th:text="${#authentication.principal.student.firstName.substring(0,1)}">U</span>
                </button>
                <div id="profileDropdown" class="profile-dropdown">
                    <div class="profile-info">
                        <div class="profile-logo-large" th:text="${#authentication.principal.student.firstName.substring(0,1)}">U</div>
                        <strong th:text="${#authentication.principal.student.firstName + ' ' + #authentication.principal.student.lastName}">User Name</strong><br>
                        <span th:text="${#authentication.principal.student.email}">user@email.com</span>
                    </div>
                    <hr>
                    <a href="/userprofile" class="profile-link">Profile</a>
                    <div style="height: 30px;"></div>
                    <a href="/logout" class="profile-link logout" style="position: absolute; bottom: 1rem; left: 1rem; right: 1rem;">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<!-- Separation between navbar and search bar -->
<div style="height: 1.5rem;"></div>
<div class="search-bar-wrapper">
    <div class="search-container" id="search-container">
        <label for="searchInput" class="visually-hidden">Search Books</label>
        <input type="text" id="searchInput" placeholder="Search books">
        <button class="search-btn" id="searchBtn" type="button">
            <i class="fas fa-search"></i>
        </button>
        <span class="search-label">Search</span>
        <button class="clear-btn" id="clearBtn" type="button">
            <i class="fas fa-times"></i> Clear
        </button>
        <div class="search-loading" id="searchLoading"></div>
        <div class="search-suggestions" id="searchSuggestions">
            <!-- Suggestions will be added dynamically -->
        </div>
    </div>
</div>


<!-- Main Content -->
<main class="main-content">
    <div class="container">
        <!-- Sorting Controls -->
        <div class="sorting-controls">
            <h2>Sort Books By:</h2>
            <div class="sort-buttons">
                <button class="sort-btn" data-sort="title">
                    <i class="fas fa-font"></i> Title
                </button>
                <button class="sort-btn" data-sort="author">
                    <i class="fas fa-user"></i> Author
                </button>
                <button class="sort-btn" data-sort="date">
                    <i class="fas fa-calendar"></i> Date
                </button>
                <select id="genreSort">
                    <label for="genreSort" class="visually-hidden">Sort by Genre</label>
                    <option value="">All Genres</option>
                    <option value="fiction">Fiction</option>
                    <option value="mystery">Mystery</option>
                    <option value="sci-fi">Science Fiction</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="biography">Biography</option>
                    <option value="history">History</option>
                </select>
            </div>
        </div>

        <!-- Books Grid -->
        <div id="booksGrid" class="books-grid">
            <!-- Books will be dynamically inserted here -->
        </div>

        <!-- Book Detail View -->
        <div id="bookDetail" class="book-detail-modal">
            <div class="modal-content">
                <button id="closeDetail" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
                <div class="book-detail-content">
                    <div class="book-image-container">
                        <img id="detailImage" src="" alt="">
                    </div>
                    <div class="book-info-container">
                        <h2 id="detailTitle"></h2>
                        <p id="detailAuthor"></p>
                        <div id="detailGenres" class="genres-container"></div>
                        <p id="detailDate"></p>
                        <p id="detailDescription"></p>
                        <div class="action-buttons">
                            <button class="read-btn">
                                <i class="fas fa-book-open"></i> Read Now
                            </button>
                            <button class="save-btn">
                                <i class="fas fa-bookmark"></i> Save
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading books...</p>
        </div>
    </div>
</main>

<script src="/Scripts/book.js"></script>
<script>
document.addEventListener('click', function(e) {
    var dropdown = document.getElementById('profileDropdown');
    var btn = document.querySelector('.profile-btn');
    if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('show');
    }
});
</script>
</body>
</html>
