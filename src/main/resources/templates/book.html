<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>book</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<nav class="navbar">
    <a href="/" class="nav-link">Home</a>
    <a href="/book" class="nav-link active">Book</a>
    <a href="/about" class="nav-link">About</a>
</nav>
<h1>Book List</h1>

<div>
    <a href="/book?sortBy=title"><button>Sort by Title</button></a>
    <a href="/book?sortBy=author"><button>Sort by Author</button></a>
</div>
<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
    </tr>
    </thead>
   <tbody>
       <tbody>
           <tr th:each="book : ${books}">
               <td th:text="${book.title}"></td>
               <td th:text="${book.author}"></td>
           </tr>
       </tbody>
</table>
</body>
</html>
