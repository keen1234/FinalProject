<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/book.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script th:inline="javascript">
        var isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
    </script>
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-content">
        <div class="nav-center">
            <ul id="navLinks" class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/book" class="nav-link active">Book</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
        <!-- Mobile hamburger (visible on small screens) -->
        <button id="hamburgerBtn" class="hamburger" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">
            <span class="bar"></span>
        </button>
        <div class="nav-auth">
            <button id="notificationBell" class="notification-bell" title="Notifications" aria-label="Notifications">
                <i class="fa fa-bell"></i>
                <span id="notificationCount" class="notification-count">0</span>
            </button>
            <a href="/login" class="nav-link" sec:authorize="isAnonymous()">Login</a>
            <div class="profile-menu"
                 sec:authorize="isAuthenticated()"
                 th:with="studentDetails=${#authentication.principal},
                          student=${studentDetails != null && studentDetails.student != null ? studentDetails.student : null}">
                <button class="profile-btn" aria-haspopup="true" aria-controls="profileDropdown" aria-expanded="false">
                    <span class="profile-logo" th:text="${student != null && student.firstName != null ? student.firstName.substring(0,1) : 'U'}">U</span>
                </button>
                <div id="profileDropdown" class="profile-dropdown" aria-hidden="true">
                    <div class="profile-info">
                        <div class="profile-logo-large" th:text="${student != null && student.firstName != null ? student.firstName.substring(0,1) : 'U'}">U</div>
                        <div class="profile-text-block">
                            <strong class="profile-name" th:text="${student.firstName + ' ' + student.lastName}">User Name</strong>
                            <span class="profile-email" th:text="${student.email}">user@email.com</span>
                        </div>
                    </div>
                    <hr class="profile-divider">
                    <a href="/userprofile" class="profile-link">Profile</a>
                    <a href="/student/notifications" class="profile-link">Notifications</a>
                    <div class="profile-spacer"></div>
                    <a href="/logout" class="profile-link logout">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<div id="notificationBar" class="notification-bar"></div>

<div class="books-main-center">
    <main class="main-content">
        <div class="book-page-wrapper">
            <div class="book-page-header book-page-header--search">
                <!-- Header kept empty so only search/sort bar shows, matching design -->
            </div>

            <div class="search-sort-center">
                <form method="get" action="/book" class="search-bar-wrapper">
                    <div class="search-container" id="search-container">
                        <input type="text"
                               id="searchInput"
                               name="search"
                               placeholder="Search books"
                               th:value="${param.search}">
                        <button class="search-btn" id="searchBtn" type="submit" aria-label="Search">
                            <i class="fas fa-search"></i>
                        </button>
                        <div class="search-loading" id="searchLoading"></div>
                        <div class="search-suggestions" id="searchSuggestions">
                            <!-- Suggestions will be added dynamically -->
                        </div>
                    </div>
                </form>
                <form method="get" action="/book" class="sorting-controls">
                    <div class="sorting-row top">
                        <span class="sorting-label">Sort Books By:</span>
                        <div class="sort-buttons">
                            <button class="sort-btn" type="submit" name="sort" value="title">
                                <i class="fas fa-font"></i> Title
                            </button>
                            <button class="sort-btn" type="submit" name="sort" value="author">
                                <i class="fas fa-user"></i> Author
                            </button>
                            <button class="sort-btn" type="submit" name="sort" value="date">
                                <i class="fas fa-calendar"></i> Date
                            </button>
                        </div>
                    </div>
                    <div class="sorting-row bottom">
                        <span class="sorting-label-genre">Sort by Genre</span>
                        <label for="genreSort" class="visually-hidden">Sort by Genre</label>
                        <select id="genreSort" name="genre" onchange="this.form.submit()">
                            <option value="">All Genres</option>
                            <option th:each="genre : ${genres}" th:value="${genre}" th:text="${genre}"></option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <table class="book-management-table" role="table" aria-label="Books Table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Genre</th>
                            <th>Published</th>
                            <th>Language</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="book : ${books}"
                            th:attr="data-title=${book.title}, data-author=${book.author}, data-datepublish=${book.datePublish}, data-genre=${book.genre}, data-language=${book.language}, data-description=${book.description}, data-status=${book.status}"
                            th:onclick="|showBookModal(this)|"
                            role="button"
                            tabindex="0"
                            onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); showBookModal(this); }">
                            <td><span class="book-title" th:text="${book.title}">Book Title</span></td>
                            <td th:text="${book.author}">Author</td>
                            <td th:text="${book.genre}">Genre</td>
                            <td th:text="${book.datePublish}">Date</td>
                            <td th:text="${book.language}">Language</td>
                            <td th:text="${book.status}"
                                th:classappend="${book.status != null} ? (${#strings.toLowerCase(book.status)} == 'available' ? ' status-available' : (${#strings.toLowerCase(book.status)} == 'reserved' or ${#strings.toLowerCase(book.status)} == 'reserve' ? ' status-reserved' : (${#strings.toLowerCase(book.status)} == 'borrowed' ? ' status-borrowed' : ''))) : ''">Status</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(books)}">
                            <td class="empty" colspan="6">No books found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Book Modal -->
            <div id="bookModal" class="book-detail-modal">
                <div class="modal-content modal-compact">
                    <button class="close-btn" onclick="closeBookModal()">&times;</button>
                    <div class="book-detail-content">
                        <h2 id="modalTitle" class="modal-title"></h2>
                        <div class="modal-meta-row">
                            <div class="modal-col">
                                <p><strong>Author:</strong> <span id="modalAuthor"></span></p>
                                <p><strong>Genre:</strong> <span id="modalGenre"></span></p>
                                <p><strong>Language:</strong> <span id="modalLanguage"></span></p>
                            </div>
                            <div class="modal-col right">
                                <p><strong>Published Date:</strong> <span id="modalDatePublish"></span></p>
                                <p><strong>Status:</strong> <span id="modalStatus"></span></p>
                            </div>
                        </div>
                        <div class="modal-description">
                            <h3>Description</h3>
                            <p id="modalDescription"></p>
                        </div>
                        <button id="reserveBtn" class="read-btn">Reserve</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const profileBtn = document.querySelector('.profile-btn');
const profileDropdown = document.getElementById('profileDropdown');

let dropdownOpen = false;

if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
            profileDropdown.classList.add('show');
            profileBtn.setAttribute('aria-expanded', 'true');
            profileDropdown.setAttribute('aria-hidden', 'false');
        } else {
            profileDropdown.classList.remove('show');
            profileBtn.setAttribute('aria-expanded', 'false');
            profileDropdown.setAttribute('aria-hidden', 'true');
        }
    });
    document.addEventListener('click', function(e) {
        if (dropdownOpen && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.remove('show');
            profileBtn.setAttribute('aria-expanded', 'false');
            profileDropdown.setAttribute('aria-hidden', 'true');
            dropdownOpen = false;
        }
    });
}

function showBookModal(card) {
    document.getElementById('modalTitle').textContent = card.getAttribute('data-title');
    document.getElementById('modalAuthor').textContent = card.getAttribute('data-author');
    document.getElementById('modalDatePublish').textContent = card.getAttribute('data-datepublish');
    document.getElementById('modalGenre').textContent = card.getAttribute('data-genre');
    document.getElementById('modalLanguage').textContent = card.getAttribute('data-language');
    document.getElementById('modalDescription').textContent = card.getAttribute('data-description');
    const modalStatusEl = document.getElementById('modalStatus');
    const statusText = card.getAttribute('data-status') || '';
    modalStatusEl.textContent = statusText;
    modalStatusEl.classList.remove('status-available', 'status-reserved', 'status-borrowed');
    const st = (statusText || '').toString().trim().toLowerCase();
    if (st === 'available') modalStatusEl.classList.add('status-available');
    else if (st === 'reserved' || st === 'reserve') modalStatusEl.classList.add('status-reserved');
    else if (st === 'borrowed' || st === 'barrowed') modalStatusEl.classList.add('status-borrowed');
    document.getElementById('bookModal').classList.add('show');
}
function closeBookModal() {
    document.getElementById('bookModal').classList.remove('show');
}
document.getElementById('reserveBtn').onclick = function() {
    if (!isAuthenticated) {
        if (confirm('You must be logged in to reserve a book. Login now?')) {
            window.location.href = '/login';
        }
        return;
    }
    const title = document.getElementById('modalTitle').textContent;
    fetch('/api/reserve', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ title })
    })
    .then(response => response.json().then(data => ({ status: response.status, body: data })))
    .then(result => {
        if (result.status === 200) {
            showNotification('Reservation request sent to admin!', 'success');
        } else {
            let errorMsg = result.body.message;
            if (typeof errorMsg !== 'string') {
                errorMsg = JSON.stringify(errorMsg);
            }
            showNotification(errorMsg || 'Error sending reservation.', 'error');
        }
    })
    .catch(() => showNotification('Error sending reservation.', 'error'));
};

// Notification bell logic
const notificationBell = document.getElementById('notificationBell');
const notificationCount = document.getElementById('notificationCount');
let notifications = [];

if (isAuthenticated) {
    loadNotifications();
    setInterval(loadNotifications, 30000);
}

function loadNotifications() {
    if (!isAuthenticated) return;

    fetch('/api/student/notifications/count')
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(data => {
            notifications = data.notifications || [];
            const count = data.count || 0;

            if (notificationCount) {
                if (count > 0) {
                    notificationCount.textContent = count;
                    notificationCount.style.display = 'inline-block';
                } else {
                    notificationCount.style.display = 'none';
                }
            }
        })
        .catch(error => {
            console.error('Error loading notifications:', error);
        });
}

if (notificationBell) {
    notificationBell.addEventListener('click', function() {
        if (notifications.length > 0) {
            const notificationMessages = notifications.map(n => n.message).join('\n\n');
            alert('\ud83d\udcec Your Notifications:\n\n' + notificationMessages + '\n\nClick on "Notifications" in your profile menu to view all notifications.');

            fetch('/api/student/notifications/mark-read', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    notifications = [];
                    if (notificationCount) {
                        notificationCount.style.display = 'none';
                        notificationCount.textContent = '0';
                    }
                }
            })
            .catch(error => {
                console.error('Error marking notifications as read:', error);
            });
        } else {
            alert('\ud83d\udd14 No new notifications\n\nCheck your notifications page for older messages!');
        }
    });
}

function showNotification(message, type = 'success') {
    const bar = document.getElementById('notificationBar');
    bar.textContent = message;
    bar.className = 'notification-bar ' + type;
    bar.style.display = 'block';
    setTimeout(() => { bar.style.display = 'none'; }, 3500);

    if (isAuthenticated) {
        setTimeout(loadNotifications, 1000);
    }
}

(function() {
    const searchInput = document.getElementById('searchInput');
    const searchBtn   = document.getElementById('searchBtn');
    const table       = document.querySelector('.book-management-table');
    const searchForm  = searchInput ? searchInput.closest('form') : null;
    if (!searchInput || !table) return;

    const tbody = table.tBodies[0];
    if (!tbody) return;

    function normalize(s) {
        return (s || '').toString().trim().toLowerCase();
    }

    function showAll() {
        Array.from(tbody.rows).forEach(row => {
            row.style.display = '';
            row.setAttribute('aria-hidden', 'false');
        });
    }

    function filterBooks() {
        const qRaw = searchInput.value || '';
        const q = normalize(qRaw);

        if (q === '') {
            showAll();
            return;
        }

        const exactMatches = [];
        Array.from(tbody.rows).forEach(row => {
            const title = normalize(row.getAttribute('data-title'));
            if (title === q) exactMatches.push(row);
        });

        if (exactMatches.length > 0) {
            Array.from(tbody.rows).forEach(row => {
                if (exactMatches.includes(row)) {
                    row.style.display = '';
                    row.setAttribute('aria-hidden', 'false');
                } else {
                    row.style.display = 'none';
                    row.setAttribute('aria-hidden', 'true');
                }
            });
            return;
        }

        const tokens = q.split(/\s+/).filter(Boolean);

        Array.from(tbody.rows).forEach(row => {
            const title = normalize(row.getAttribute('data-title'));
            const author = normalize(row.getAttribute('data-author'));
            const genre = normalize(row.getAttribute('data-genre'));

            const titleWords = title.split(/\s+/).filter(Boolean);
            const authorWords = author.split(/\s+/).filter(Boolean);
            const genreWords = genre.split(/\s+/).filter(Boolean);

            const allWords = titleWords.concat(authorWords, genreWords);

            const matches = tokens.every(tok => allWords.some(w => w.startsWith(tok)));

            if (matches) {
                row.style.display = '';
                row.setAttribute('aria-hidden', 'false');
            } else {
                row.style.display = 'none';
                row.setAttribute('aria-hidden', 'true');
            }
        });
    }

    searchInput.addEventListener('input', function() {
        filterBooks();
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (searchForm) {
                return; // let form submit
            }
            e.preventDefault();
            filterBooks();
        }
    });

    if (searchBtn) {
        searchBtn.addEventListener('click', function(e) {
            if (!searchForm) {
                e.preventDefault();
                filterBooks();
                searchInput.focus();
            }
        });
    }
})();

(function() {
    const hamburger = document.getElementById('hamburgerBtn');
    const navLinks = document.getElementById('navLinks');
    if (!hamburger || !navLinks) return;

    function closeMenu() {
        navLinks.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('body-menu-open');
    }

    hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = navLinks.classList.toggle('open');
        hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        document.body.classList.toggle('body-menu-open', isOpen);
    });

    document.addEventListener('click', (e) => {
        if (!navLinks.classList.contains('open')) return;
        if (!navLinks.contains(e.target) && !hamburger.contains(e.target)) {
            closeMenu();
        }
    });

    window.addEventListener('resize', () => {
        if (window.innerWidth > 560) closeMenu();
    });

    navLinks.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        if (window.innerWidth <= 560) closeMenu();
    });
})();
</script>
</body>
</html>
