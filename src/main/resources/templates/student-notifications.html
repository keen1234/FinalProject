<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Notifications - Librows</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .notifications-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .notification-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .notification-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .notification-item.unread {
            background: #e3f2fd;
            border-color: #2196f3;
        }
        .notification-message {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .notification-date {
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
        }
        .notification-date i {
            margin-right: 0.5rem;
        }
        .no-notifications {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
        .no-notifications i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        .back-btn {
            background: #2196f3;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            margin-bottom: 2rem;
            transition: background-color 0.3s ease;
        }
        .back-btn:hover {
            background: #1976d2;
            color: white;
            text-decoration: none;
        }
        .back-btn i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-content">
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/book" class="nav-link">Book</a></li>
                <li><a href="/about" class="nav-link">About</a></li>
            </ul>
        </div>
        <div class="nav-auth">
            <button id="notificationBell" class="notification-bell" title="Notifications" aria-label="Notifications">
                <i class="fa fa-bell"></i>
                <span id="notificationCount" class="notification-count" style="display:none;">0</span>
            </button>
            <div class="profile-menu" sec:authorize="isAuthenticated()">
                <button class="profile-btn" aria-haspopup="true" aria-controls="profileDropdown" aria-expanded="false">
                    <span class="profile-logo" th:text="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails) ? #authentication.principal.student.firstName.substring(0,1) : 'U'}">U</span>
                </button>
                <div id="profileDropdown" class="profile-dropdown" aria-hidden="true">
                    <div class="profile-info">
                        <div class="profile-logo-large" th:text="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails) ? #authentication.principal.student.firstName.substring(0,1) : 'U'}">U</div>
                        <div th:if="${#authentication.principal instanceof T(com.example.FinalProject.model.StudentDetails)}">
                            <div style="display:flex;flex-direction:column;align-items:center;">
                                <strong th:text="${#authentication.principal.student.firstName + ' ' + #authentication.principal.student.lastName}" style="font-size:1.1em;"></strong>
                                <span th:text="${#authentication.principal.student.email}" style="color:#888;font-size:0.95em;margin-top:2px;"></span>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <a href="/userprofile" class="profile-link">Profile</a>
                    <a href="/student/notifications" class="profile-link">Notifications</a>
                    <div style="height: 30px;"></div>
                    <a href="/logout" class="profile-link logout">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="notifications-container">
    <a href="/" class="back-btn">
        <i class="fa fa-arrow-left"></i>
        Back to Home
    </a>
    
    <h1 style="color: #333; margin-bottom: 2rem;">
        <i class="fa fa-bell" style="margin-right: 0.5rem; color: #2196f3;"></i>
        My Notifications
    </h1>
    
    <div th:if="${notifications != null and #lists.size(notifications) > 0}">
        <div th:each="notification : ${notifications}" 
             class="notification-item" 
             th:classappend="${!notification.read} ? 'unread' : ''">
            <div class="notification-message" th:text="${notification.message}"></div>
            <div class="notification-date">
                <i class="fa fa-clock"></i>
                <span th:text="${#temporals.format(notification.createdAt, 'MMMM dd, yyyy \u2022 hh:mm a')}"></span>
                <span th:if="${!notification.read}" style="margin-left: auto; color: #2196f3; font-weight: bold;">
                    <i class="fa fa-circle" style="font-size: 0.5rem;"></i> New
                </span>
            </div>
        </div>
    </div>
    
    <div th:if="${notifications == null or #lists.size(notifications) == 0}" class="no-notifications">
        <i class="fa fa-bell-slash"></i>
        <h3>No notifications yet</h3>
        <p>You'll receive notifications here when admins respond to your book reservations.</p>
        <a href="/book" class="back-btn" style="margin-top: 1rem;">
            <i class="fa fa-book"></i>
            Browse Books
        </a>
    </div>
</div>

<script>
const profileBtn = document.querySelector('.profile-btn');
const profileDropdown = document.getElementById('profileDropdown');

let dropdownOpen = false;

if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
            profileDropdown.classList.add('show');
            profileBtn.setAttribute('aria-expanded', 'true');
            profileDropdown.setAttribute('aria-hidden', 'false');
        } else {
            profileDropdown.classList.remove('show');
            profileBtn.setAttribute('aria-expanded', 'false');
            profileDropdown.setAttribute('aria-hidden', 'true');
        }
    });
    document.addEventListener('click', function(e) {
        if (dropdownOpen && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.remove('show');
            profileBtn.setAttribute('aria-expanded', 'false');
            profileDropdown.setAttribute('aria-hidden', 'true');
            dropdownOpen = false;
        }
    });
}
</script>
</body>
</html>
