<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin Home</title>
    <link rel="stylesheet" href="/css/book.css">
</head>
<body>
<nav class="navbar" aria-label="Main Navigation">
    <div class="navbar-content">
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="/admin-home" class="nav-link active">Home</a></li>
                <li><a href="/admin/book" class="nav-link">Book</a></li>
            </ul>
        </div>
        <div class="nav-auth">
            <a href="/login" class="nav-link" sec:authorize="isAnonymous()">Login</a>
            <div class="profile-menu" sec:authorize="isAuthenticated()">
                <button class="profile-btn">
                    <span class="profile-logo" th:text="${admin != null and admin.name != null and #strings.length(admin.name) > 0 ? admin.name.substring(0,1) : 'A'}">A</span>
                </button>
                <div id="profileDropdown" class="profile-dropdown">
                    <div class="profile-info">
                        <div class="profile-logo-large" th:text="${admin != null and admin.name != null and #strings.length(admin.name) > 0 ? admin.name.substring(0,1) : 'A'}">A</div>
                        <div th:if="${admin != null}">
                            <strong th:text="${admin.name}" style="font-size:1.1em;"></strong><br>
                            <span th:text="${admin.email}" style="color:#888;font-size:0.95em;margin-top:2px;"></span><br>
                            <span th:text="${admin.status}" style="color:#007b00;font-size:0.95em;margin-top:2px;"></span>
                        </div>
                    </div>
                    <hr>
                    <div style="height: 30px;"></div>
                    <a href="/logout" class="profile-link logout" style="position: absolute; bottom: 1rem; left: 1rem; right: 1rem;">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>
<main sec:authorize="hasRole('ADMIN')">
    <h1>Welcome, Admin <span th:text="${admin.name}">Admin</span>!</h1>
</main>
<div sec:authorize="!hasRole('ADMIN')">
    <p>You are not authorized to view this page.</p>
</div>
<script>
const profileBtn = document.querySelector('.profile-btn');
const profileDropdown = document.getElementById('profileDropdown');
let dropdownOpen = false;
if (profileBtn && profileDropdown) {
    profileBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
            profileDropdown.classList.add('show');
        } else {
            profileDropdown.classList.remove('show');
        }
    });
    document.addEventListener('click', function(e) {
        if (dropdownOpen && !profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
            profileDropdown.classList.remove('show');
            dropdownOpen = false;
        }
    });
}
</script>
</body>
</html>
